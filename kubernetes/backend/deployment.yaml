apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devopspulse
  labels:
    app: devopspulse
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopspulse
      tier: backend
  template:
    metadata:
      labels:
        app: devopspulse
        tier: backend
    spec:
      containers:
        - name: backend
          image: 931071725553.dkr.ecr.ap-south-1.amazonaws.com/eks-platform-dev-backend:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
