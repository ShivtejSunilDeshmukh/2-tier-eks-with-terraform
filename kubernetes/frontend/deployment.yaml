apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devopspulse
  labels:
    app: devopspulse
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopspulse
      tier: frontend
  template:
    metadata:
      labels:
        app: devopspulse
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: 931071725553.dkr.ecr.ap-south-1.amazonaws.com/eks-platform-dev-frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
